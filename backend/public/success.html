<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — AC Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--bg2:#111115;--border:rgba(255,255,255,0.07);--accent:#e8373e;--text:#f0f0f4;--muted:#6b6b7a;--green:#22c55e;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.icon{font-size:64px;margin-bottom:24px}
h1{font-family:'Rajdhani',sans-serif;font-size:40px;font-weight:700;margin-bottom:12px}
h1 span{color:var(--green)}
p{color:var(--muted);font-size:15px;max-width:400px;line-height:1.7;margin-bottom:32px}
a{display:inline-block;background:linear-gradient(135deg,#6d28d9,var(--purple));color:#fff;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;padding:12px 28px;border-radius:8px;text-decoration:none}
a:hover{opacity:.85}
</style>
</head>
<body>
<div class="icon">🏁</div>
<h1>Tokens <span>Added!</span></h1>
<p>Your coaching tokens are now in your account. Open the AC Dashboard app, go to Settings, and they'll be ready to use.</p>
<a href="/">Back to Account</a>
</body>
</html>

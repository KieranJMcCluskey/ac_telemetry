[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  # The functions runtime is Node 20 regardless of this (Netlify ignores toml
  # runtime hints for this site), so the Supabase WebSocket requirement is
  # handled by a `ws` polyfill in functions/_shared/supabase.js instead.
  NODE_VERSION = "22"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

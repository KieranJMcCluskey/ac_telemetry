[build]
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  # Node 22+ has native WebSocket, required by @supabase/supabase-js's realtime
  # client (constructed inside createClient). On Node 20 every function 502s.
  NODE_VERSION = "22"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
